<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --border-bright: #3a3a3a;
      --text: #f0f0f0;
      --muted: #555;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
  font-family: 'Geist Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

/* Fond animé */
.bg-glow {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: 
    radial-gradient(ellipse at 20% 50%, rgba(74,222,128,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(96,165,250,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 60% 80%, rgba(251,191,36,0.05) 0%, transparent 55%);
  animation: bgShift 8s ease-in-out infinite alternate;
  pointer-events: none;
}

@keyframes bgShift {
  0% {
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(74,222,128,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(96,165,250,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 60% 80%, rgba(251,191,36,0.05) 0%, transparent 55%);
  }
  50% {
    background: 
      radial-gradient(ellipse at 60% 30%, rgba(96,165,250,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 30% 70%, rgba(74,222,128,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 60%, rgba(251,191,36,0.05) 0%, transparent 55%);
  }
  100% {
    background: 
      radial-gradient(ellipse at 40% 70%, rgba(74,222,128,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 30%, rgba(251,191,36,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 20% 60%, rgba(96,165,250,0.05) 0%, transparent 55%);
  }
}

    .card {
  width: 100%;
  max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 40px;
  box-shadow: var(--shadow);
  animation: fadeUp 0.5s ease both;
  position: relative;
  z-index: 1;
}

    .card-header {
      margin-bottom: 32px;
      text-align: center;
    }

    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Password display */
    .password-wrap {
      border: 1px solid var(--border-bright);
      background: var(--bg);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      min-height: 56px;
    }

    .password-text {
      font-size: 16px;
      letter-spacing: 0.08em;
      word-break: break-all;
      flex: 1;
      color: var(--text);
    }

    .password-placeholder {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .copy-btn {
      border: 1px solid var(--border-bright);
      background: transparent;
      color: var(--muted);
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover { border-color: var(--text); color: var(--text); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    /* Strength bar */
    .strength-wrap {
      margin-bottom: 28px;
    }

    .strength-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .strength-value { transition: color 0.3s; }

    .strength-track {
      height: 3px;
      background: var(--border);
      display: flex;
      gap: 3px;
    }

    .strength-segment {
      flex: 1;
      height: 100%;
      background: var(--border);
      transition: background 0.3s;
    }

    /* Options */
    .options { margin-bottom: 28px; }

    .options-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    /* Length slider */
    .length-wrap {
      margin-bottom: 20px;
    }

    .length-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .length-val {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      color: var(--text);
    }

    input[type="range"] {
      width: 100%;
      appearance: none;
      height: 3px;
      background: var(--border-bright);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 16px;
      height: 16px;
      background: var(--text);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { background: #ccc; }

    /* Checkboxes */
    .checkboxes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .checkbox-item:hover { border-color: var(--border-bright); }
    .checkbox-item.checked { border-color: var(--text); background: rgba(255,255,255,0.03); }

    .checkbox-box {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 9px;
      transition: all 0.15s;
    }

    .checkbox-item.checked .checkbox-box {
      background: var(--text);
      border-color: var(--text);
      color: #000;
    }

    .checkbox-label { font-size: 11px; letter-spacing: 0.06em; }

    /* Generate button */
    .generate-btn {
      width: 100%;
      padding: 14px;
      background: var(--text);
      color: #000;
      border: none;
      font-family: 'Geist Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s;
      font-weight: 500;
    }

    .generate-btn:hover { background: #ccc; }
    .generate-btn:active { background: #aaa; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--green);
      color: #000;
      padding: 10px 20px;
      font-size: 11px;
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="card">
    <div class="card-header">
    <div class="card-title">Password Generator</div>
    <div class="card-subtitle">Générer des mots de passe sécurisés</div>
  </div>

  <!-- Password display -->
  <div class="password-wrap">
    <div class="password-text" id="passwordDisplay">
      <span class="password-placeholder">Clique sur générer...</span>
    </div>
    <button class="copy-btn" id="copyBtn" onclick="copyPassword()">Copier</button>
  </div>

  <!-- Strength -->
  <div class="strength-wrap">
    <div class="strength-label">
      <span>Force</span>
      <span class="strength-value" id="strengthLabel">—</span>
    </div>
    <div class="strength-track">
      <div class="strength-segment" id="seg1"></div>
      <div class="strength-segment" id="seg2"></div>
      <div class="strength-segment" id="seg3"></div>
      <div class="strength-segment" id="seg4"></div>
    </div>
  </div>

  <!-- Options -->
  <div class="options">
    <div class="options-label">Options</div>

    <div class="length-wrap">
      <div class="length-header">
        <span style="color:var(--muted); font-size:11px; letter-spacing:0.1em;">LONGUEUR</span>
        <span class="length-val" id="lengthVal">16</span>
      </div>
      <input type="range" id="lengthSlider" min="4" max="64" value="16"
        oninput="document.getElementById('lengthVal').textContent = this.value" />
    </div>

    <div class="checkboxes">
      <div class="checkbox-item checked" id="cb-lowercase" onclick="toggleCheck('lowercase')">
        <div class="checkbox-box">✓</div>
        <span class="checkbox-label">Minuscules</span>
      </div>
      <div class="checkbox-item checked" id="cb-uppercase" onclick="toggleCheck('uppercase')">
        <div class="checkbox-box">✓</div>
        <span class="checkbox-label">Majuscules</span>
      </div>
      <div class="checkbox-item checked" id="cb-numbers" onclick="toggleCheck('numbers')">
        <div class="checkbox-box">✓</div>
        <span class="checkbox-label">Chiffres</span>
      </div>
      <div class="checkbox-item" id="cb-symbols" onclick="toggleCheck('symbols')">
        <div class="checkbox-box"></div>
        <span class="checkbox-label">Symboles</span>
      </div>
    </div>
  </div>

  <button class="generate-btn" onclick="generate()">⚡ Générer</button>
</div>

<div class="toast" id="toast">Copié !</div>

<script>
  const checks = {
    lowercase: true,
    uppercase: true,
    numbers: true,
    symbols: false
  };

  let currentPassword = '';

  function toggleCheck(type) {
    checks[type] = !checks[type];
    const el = document.getElementById(`cb-${type}`);
    const box = el.querySelector('.checkbox-box');
    el.classList.toggle('checked', checks[type]);
    box.textContent = checks[type] ? '✓' : '';
  }

  async function generate() {
    const length = parseInt(document.getElementById('lengthSlider').value);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ length, ...checks })
      });

      const data = await res.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      currentPassword = data.password;
      document.getElementById('passwordDisplay').textContent = data.password;
      updateStrength(data.strength);

    } catch {
      alert('Erreur serveur — vérifie que Node.js tourne');
    }
  }

  function updateStrength(strength) {
    const colors = ['',  '#f87171', '#f97316', '#fbbf24', '#4ade80'];
    const label = document.getElementById('strengthLabel');
    const segments = [
      document.getElementById('seg1'),
      document.getElementById('seg2'),
      document.getElementById('seg3'),
      document.getElementById('seg4')
    ];

    label.textContent = strength.label;
    label.style.color = realColors[strength.level];

    segments.forEach((seg, i) => {
      seg.style.background = i < strength.level ? realColors[strength.level] : 'var(--border)';
    });
  }

  async function copyPassword() {
    if (!currentPassword) return;
    await navigator.clipboard.writeText(currentPassword);
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copié !';
    btn.classList.add('copied');
    showToast();
    setTimeout(() => {
      btn.textContent = 'Copier';
      btn.classList.remove('copied');
    }, 2000);
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Génère un mot de passe au chargement
  generate();
</script>

</body>
</html>
